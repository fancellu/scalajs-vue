<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Scala.js + Vue examples</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23C2261D'/%3E%3Cpath d='M9 9l7 14 7-14' fill='none' stroke='%23fff' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vuetify@4.3.1/dist/vuetify.min.css"/>
  <style>
    /* Unlayered, so these sit on top of Vuetify's cascade layers. */
    .page { max-width: 1040px; }
    .tabular { font-variant-numeric: tabular-nums; }
    .bar { transition: width .5s ease, background-color .5s ease; }
    .search-field { min-width: 220px; max-width: 360px; }
    .code-block {
      margin: 0;
      padding: 16px;
      border-radius: 8px;
      background: rgb(var(--v-theme-surface-light));
      font-size: .875rem;
      white-space: pre-wrap;
      overflow-x: auto;
    }
    .drawing { cursor: crosshair; touch-action: manipulation; aspect-ratio: 600 / 360; }
    .drawing .circle { cursor: pointer; transition: fill-opacity .15s ease; }
  </style>
</head>
<body>

<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.5.45/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vuetify@4.3.1/dist/vuetify.min.js"></script>
<script src="opt/main.js"></script>
<script>
  // ScalaVue is exported from Scala (example.Main); it returns the root component instance
  var app = ScalaVue.main("#app");
</script>

</body>
</html>
